<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 405" role="img" aria-labelledby="title desc">
<title id="title">PHP2Shell research and disclosure timeline</title>
<desc id="desc">2024 early signs of an out-of-memory issue, 11 August 2026 Calif reports remote code execution, 17 October AWS later identifies a honeypot exploitation attempt, 20 October vulnerability IDs circulate and a demonstration video is mistakenly published, 21 October PHP ships patches, 23 October a separate related issue receives an advisory, and 27 October Wiz reports ongoing monitoring.</desc>
<rect width="1280" height="405" rx="24" fill="#0A1120"/>
<rect x="1" y="1" width="1278" height="403" rx="23" stroke="#273553" stroke-width="2" fill="none"/>
<text x="54" y="55" fill="#8FAEFF" font-size="15" font-family="Arial, sans-serif" letter-spacing="3" font-weight="700">PHP2SHELL / RESEARCH AND DISCLOSURE</text>
<text x="54" y="100" fill="#F5F7FF" font-family="Arial, sans-serif" font-size="31" font-weight="700">A long lead-up. A compressed release window.</text>
<line x1="95" y1="188" x2="1194" y2="188" stroke="#55627D" stroke-width="3"/>
<g font-family="Arial, sans-serif">
<g><circle cx="100" cy="188" r="9" fill="#8FAEFF"/><text x="75" y="160" font-size="18" fill="#F5F7FF" font-weight="700">2024</text><text x="75" y="226" font-size="15" fill="#CDD6E8">First signs</text><text x="75" y="248" font-size="15" fill="#CDD6E8">recognized</text></g>
<g><circle cx="270" cy="188" r="9" fill="#8FAEFF"/><text x="240" y="160" font-size="18" fill="#F5F7FF" font-weight="700">11 Aug</text><text x="235" y="226" font-size="15" fill="#CDD6E8">Calif reports</text><text x="235" y="248" font-size="15" fill="#CDD6E8">RCE path</text></g>
<g><circle cx="445" cy="188" r="9" fill="#8FAEFF"/><text x="415" y="160" font-size="18" fill="#F5F7FF" font-weight="700">17 Oct</text><text x="405" y="226" font-size="15" fill="#CDD6E8">AWS honeypot</text><text x="405" y="248" font-size="15" fill="#CDD6E8">attempt*</text></g>
<g><circle cx="625" cy="188" r="9" fill="#8FAEFF"/><text x="596" y="160" font-size="18" fill="#F5F7FF" font-weight="700">20 Oct</text><text x="582" y="226" font-size="15" fill="#CDD6E8">CVE IDs circulate;</text><text x="582" y="248" font-size="15" fill="#CDD6E8">demo video leaks</text></g>
<g><circle cx="808" cy="188" r="10" fill="#D9E5FF"/><text x="777" y="160" font-size="18" fill="#F5F7FF" font-weight="700">21 Oct</text><text x="773" y="226" font-size="15" fill="#CDD6E8">PHP security</text><text x="773" y="248" font-size="15" fill="#CDD6E8">fixes released</text></g>
<g><circle cx="985" cy="188" r="9" fill="#8FAEFF"/><text x="955" y="160" font-size="18" fill="#F5F7FF" font-weight="700">23 Oct</text><text x="943" y="226" font-size="15" fill="#CDD6E8">Separate related</text><text x="943" y="248" font-size="15" fill="#CDD6E8">advisory</text></g>
<g><circle cx="1153" cy="188" r="9" fill="#8FAEFF"/><text x="1124" y="160" font-size="18" fill="#F5F7FF" font-weight="700">27 Oct</text><text x="1110" y="226" font-size="15" fill="#CDD6E8">Wiz follow-up</text><text x="1110" y="248" font-size="15" fill="#CDD6E8">published</text></g>
</g>
<text x="54" y="327" fill="#A6B6D4" font-family="Arial, sans-serif" font-size="15">* The 17 October attempt was identified retrospectively and reported by AWS on 21 October.</text>
<text x="54" y="358" fill="#8391AE" font-family="Arial, sans-serif" font-size="14">Sources: PHP Foundation, php.net, AWS Threat Intelligence and Wiz. Dates are historical events, not evidence of universal compromise.</text>
</svg>
