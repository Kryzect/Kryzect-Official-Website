<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 395" role="img" aria-labelledby="title desc">
<title id="title">The discovery-to-remediation gap: four clocks</title>
<desc id="desc">An editorial framework showing four different stages from proving a vulnerability to making deployed systems safer: discovery, decision, distribution and deployment. This is a conceptual model, not measured PHP2Shell timing data.</desc>
<rect width="1200" height="395" rx="24" fill="#0A1120"/>
<rect x="1" y="1" width="1198" height="393" rx="23" fill="none" stroke="#273553" stroke-width="2"/>
<text x="54" y="57" fill="#8FAEFF" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">KRYZECT / ENGINEERING NOTES</text>
<text x="54" y="104" fill="#F5F7FF" font-family="Arial, sans-serif" font-size="33" font-weight="700">Four clocks. One exposed system.</text>
<text x="54" y="138" fill="#B3BED5" font-family="Arial, sans-serif" font-size="17">Speeding up discovery does not automatically speed up everything that follows.</text>
<path d="M90 224 H1110" fill="none" stroke="#445373" stroke-width="2" stroke-dasharray="6 7"/>
<g font-family="Arial, sans-serif">
<g><rect x="50" y="173" width="260" height="137" rx="14" fill="#111A2E" stroke="#45577C"/><circle cx="82" cy="202" r="11" fill="#8FAEFF"/><text x="110" y="210" fill="#D3DDF0" font-size="14" font-weight="700" letter-spacing="2">01 / DISCOVERY</text><text x="69" y="250" fill="#F5F7FF" font-size="19" font-weight="700">Prove the impact</text><text x="69" y="279" fill="#A8B5CE" font-size="15">Find and reproduce the flaw</text></g>
<g><rect x="330" y="173" width="260" height="137" rx="14" fill="#111A2E" stroke="#45577C"/><circle cx="362" cy="202" r="11" fill="#8FAEFF"/><text x="390" y="210" fill="#D3DDF0" font-size="14" font-weight="700" letter-spacing="2">02 / DECISION</text><text x="349" y="250" fill="#F5F7FF" font-size="19" font-weight="700">Choose a safe fix</text><text x="349" y="279" fill="#A8B5CE" font-size="15">Test trade-offs and regressions</text></g>
<g><rect x="610" y="173" width="260" height="137" rx="14" fill="#111A2E" stroke="#45577C"/><circle cx="642" cy="202" r="11" fill="#8FAEFF"/><text x="670" y="210" fill="#D3DDF0" font-size="14" font-weight="700" letter-spacing="2">03 / DISTRIBUTION</text><text x="629" y="250" fill="#F5F7FF" font-size="19" font-weight="700">Ship the update</text><text x="629" y="279" fill="#A8B5CE" font-size="15">Build releases and packages</text></g>
<g><rect x="890" y="173" width="260" height="137" rx="14" fill="#111A2E" stroke="#45577C"/><circle cx="922" cy="202" r="11" fill="#8FAEFF"/><text x="950" y="210" fill="#D3DDF0" font-size="14" font-weight="700" letter-spacing="2">04 / DEPLOYMENT</text><text x="909" y="250" fill="#F5F7FF" font-size="19" font-weight="700">Reduce real exposure</text><text x="909" y="279" fill="#A8B5CE" font-size="15">Roll out and verify in production</text></g>
</g>
<text x="54" y="360" fill="#8E9AB5" font-family="Arial, sans-serif" font-size="14">Conceptual framework by Kryzect. Not incident timing data.</text>
</svg>
